<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confirmation Page</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    rgba(0,0,0,0.65),
    rgba(0,0,0,0.65)
    ),

    url('https://images.unsplash.com/photo-1517649763962-0c623066013b?q=80&w=1974&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    overflow:hidden;
}

/* GLASS CARD */

.form-container{

    width:90%;
    max-width:550px;

    padding:50px;

    border-radius:25px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 10px 40px rgba(0,0,0,0.4);

    text-align:center;

    color:white;

    animation:fadeIn 1s ease;
}

/* ICON */

.icon{

    font-size:5rem;

    margin-bottom:20px;

    animation:float 3s ease-in-out infinite;
}

/* TITLE */

h1{

    font-family:'Orbitron',sans-serif;

    font-size:2.5rem;

    margin-bottom:20px;

    letter-spacing:2px;

    text-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* TEXT */

p{

    font-size:1.15rem;

    line-height:1.8;

    color:#e5e5e5;

    margin-bottom:35px;
}

/* BUTTON CONTAINER */

.buttons{

    display:flex;

    gap:20px;

    justify-content:center;

    flex-wrap:wrap;
}

/* BUTTONS */

.button{

    border:none;

    padding:16px 40px;

    font-size:1rem;

    font-weight:600;

    border-radius:50px;

    cursor:pointer;

    color:white;

    transition:0.4s ease;

    min-width:180px;

    position:relative;

    overflow:hidden;
}

/* BUTTON GLOW EFFECT */

.button::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    rgba(255,255,255,0.2);

    transition:0.5s;
}

.button:hover::before{
    left:100%;
}

/* NO BUTTON */

.button1{

    background:
    linear-gradient(
    135deg,
    #ff2d2d,
    #b00000
    );

    box-shadow:
    0 0 20px rgba(255,0,0,0.4);
}

.button1:hover{

    transform:translateY(-5px) scale(1.05);

    box-shadow:
    0 0 30px rgba(255,0,0,0.7);
}

/* YES BUTTON */

.button2{

    background:
    linear-gradient(
    135deg,
    #00d94d,
    #009929
    );

    box-shadow:
    0 0 20px rgba(0,255,100,0.4);
}

.button2:hover{

    transform:translateY(-5px) scale(1.05);

    box-shadow:
    0 0 30px rgba(0,255,100,0.7);
}

/* ANIMATIONS */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* RESPONSIVE */

@media(max-width:600px){

    .form-container{
        padding:35px 25px;
    }

    h1{
        font-size:2rem;
    }

    .buttons{
        flex-direction:column;
    }

    .button{
        width:100%;
    }
}

</style>

</head>

<body>

<div class="form-container">

<div class="icon">
🏆
</div>

<h1>Confirmation Page</h1>

<p>
Are you sure you want to continue with the registration process for the National Sports Agency?
</p>

<div class="buttons">

<button
class="button button1"
onclick="document.location='Homepage.html'">

NO

</button>

<button
class="button button2"
onclick="document.location='LAB 5.html'">

YES

</button>

</div>

</div>

</body>
</html>
