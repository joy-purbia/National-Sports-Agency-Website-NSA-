<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    rgba(0,0,0,0.75),
    rgba(0,0,0,0.75)
    ),

    url('https://images.unsplash.com/photo-1517649763962-0c623066013b?q=80&w=1974&auto=format&fit=crop');

    background-size:cover;
    background-position:center;
    overflow-x:hidden;
    overflow-y:auto;

    padding:40px 20px;
}

/* MAIN CARD */

.form-container{

    width:100%;
    max-width:700px;

    padding:50px;

    border-radius:30px;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:blur(18px);

    border:
    1px solid rgba(255,255,255,0.2);

    box-shadow:
    0 15px 40px rgba(0,0,0,0.5);

    color:white;

    animation:fadeIn 1s ease;
}

/* TITLE */

h1{

    text-align:center;

    font-size:3.5rem;

    margin-bottom:15px;

    color:#00d9ff;

    font-family:'Orbitron',sans-serif;

    letter-spacing:3px;

    text-shadow:
    0 0 20px rgba(0,217,255,0.7);
}

/* SUBTEXT */

.subtitle{

    text-align:center;

    color:#d9d9d9;

    margin-bottom:40px;

    font-size:1.05rem;

    line-height:1.8;
}

/* FORM GROUP */

.form-group{

    margin-bottom:25px;
}

/* LABEL */

label{

    display:block;

    margin-bottom:10px;

    font-weight:600;

    color:#ffffff;
}

/* INPUTS */

input,
textarea{

    width:100%;

    padding:16px 20px;

    border:none;

    border-radius:15px;

    background:
    rgba(255,255,255,0.15);

    color:white;

    font-size:1rem;

    outline:none;

    transition:0.4s ease;

    border:
    1px solid rgba(255,255,255,0.1);
}

/* PLACEHOLDER */

input::placeholder,
textarea::placeholder{

    color:#d3d3d3;
}

/* FOCUS EFFECT */

input:focus,
textarea:focus{

    border:
    1px solid #00d9ff;

    box-shadow:
    0 0 20px rgba(0,217,255,0.5);

    transform:scale(1.02);
}

/* TEXTAREA */

textarea{

    resize:none;

    height:140px;
}

/* BUTTON */

.button{

    width:100%;

    padding:18px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(
    135deg,
    #00d9ff,
    #005eff
    );

    color:white;

    font-size:1.1rem;

    font-weight:600;

    cursor:pointer;

    transition:0.4s ease;

    margin-top:10px;

    box-shadow:
    0 0 25px rgba(0,94,255,0.5);

    position:relative;

    overflow:hidden;
}

/* BUTTON SHINE EFFECT */

.button::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    rgba(255,255,255,0.2);

    transition:0.5s;
}

.button:hover::before{
    left:100%;
}

/* BUTTON HOVER */

.button:hover{

    transform:
    translateY(-5px)
    scale(1.02);

    box-shadow:
    0 0 35px rgba(0,94,255,0.8);
}

/* CONTACT INFO */

.contact-info{

    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-top:40px;

    flex-wrap:wrap;
}

.info-box{

    flex:1;

    min-width:180px;

    background:
    rgba(255,255,255,0.08);

    padding:20px;

    border-radius:18px;

    text-align:center;

    transition:0.4s ease;
}

.info-box:hover{

    transform:translateY(-8px);

    background:
    rgba(255,255,255,0.15);
}

.info-box h3{

    margin-bottom:10px;

    color:#00d9ff;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */

@media(max-width:768px){

    .form-container{
        padding:35px 25px;
    }

    h1{
        font-size:2.4rem;
    }

    .contact-info{
        flex-direction:column;
    }
}

</style>

</head>

<body>

<div class="form-container">

<h1>CONTACT US</h1>

<p class="subtitle">
Have questions, suggestions, or need support?  
Fill out the form below and our National Sports Agency team will get back to you soon.
</p>

<form>

<div class="form-group">

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

</div>

<div class="form-group">

<label for="phone">
Mobile Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter your mobile number"
required>

</div>

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

<div class="form-group">

<label for="message">
Message
</label>

<textarea
id="message"
placeholder="Write your message here..."></textarea>

</div>

<button class="button" type="submit">

Send Message

</button>

</form>

<!-- EXTRA INFO -->

<div class="contact-info">

<div class="info-box">

<h3>📍 Address</h3>

<p>New Delhi, India</p>

</div>

<div class="info-box">

<h3>📞 Support</h3>

<p>+91 98765 43210</p>

</div>

<div class="info-box">

<h3>✉ Email</h3>

<p>support@nsai.com</p>

</div>

</div>

</div>

</body>
</html>
